services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env
      - backend/.env.docker
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: ["uv", "run", "uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  celery:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env
      - backend/.env.docker
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--pool=solo"]

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - .env
      - frontend/.env.docker
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  prisma:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: dev
    env_file:
      - .env
      - frontend/.env.docker
    command: ["sh", "-c", "npx prisma db push && npx prisma generate"]

volumes:
  frontend_node_modules:
